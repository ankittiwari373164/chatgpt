# ============================================================
#  Render deployment — drop this file at the repo root.
#  Then: New + → Blueprint → connect your Git repo → deploy.
# ============================================================

services:

  - type: web
    name: ai-content-automation
    runtime: node
    plan: free
    region: oregon         # or singapore / frankfurt — closer to you
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true

    envVars:

      - key: NODE_VERSION
        value: 20

      # Set these manually in the Render dashboard — never commit secrets
      - key: ADMIN_TOKEN
        sync: false

      - key: MONGODB_URI
        sync: false

      - key: GROQ_API_KEY
        sync: false

      - key: CLOUDINARY_CLOUD_NAME
        sync: false

      - key: CLOUDINARY_API_KEY
        sync: false

      - key: CLOUDINARY_API_SECRET
        sync: false

      - key: META_ACCESS_TOKEN
        sync: false

      - key: IMAGE_FALLBACK_ENABLED
        value: "false"
