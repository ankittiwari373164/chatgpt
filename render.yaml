services:

  - type: web
    name: ai-content-automation
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci || npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true

    envVars:

      - key: NODE_VERSION
        value: "20"

      - key: ADMIN_TOKEN
        sync: false

      - key: MONGODB_URI
        sync: false

      - key: GROQ_API_KEY
        sync: false

      - key: CLOUDINARY_CLOUD_NAME
        sync: false

      - key: CLOUDINARY_API_KEY
        sync: false

      - key: CLOUDINARY_API_SECRET
        sync: false

      - key: META_ACCESS_TOKEN
        sync: false

      - key: IMAGE_FALLBACK_ENABLED
        value: "true"